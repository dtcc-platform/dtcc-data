services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: dtcc_test
      POSTGRES_USER: dtcc
      POSTGRES_PASSWORD: dtcc
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtcc -d dtcc_test"]
      interval: 2s
      timeout: 5s
      retries: 10
