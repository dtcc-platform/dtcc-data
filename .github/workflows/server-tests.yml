name: Server tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/server-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install server test dependencies
        run: python -m pip install -r tests/requirements-server.txt
      - name: Test server lifecycle and request handling
        env:
          PYTHONPATH: src
        run: >-
          python -B -m pytest -o asyncio_default_fixture_loop_scope=function
          tests/test_server_shutdown.py tests/test_rate_limiter.py
          tests/test_server.py tests/test_db.py -v
